name: scrape-xi-speeches-unattended

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unattended-data-run
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initial setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas

      - name: Run scraper
        run: python main.py

      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: xi-speeches-${{ github.run_id }}
          path: master_xi_speeches.csv
          if-no-files-found: error
